query CartDeliveryOptionsTransformRunInput(
  $customerTags: [String!]! = []
  $productTags: [String!]! = []
) {
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        hasTags(tags: $customerTags) {
          tag
          hasTag
        }
      }
      purchasingCompany {
        company {
          name
        }
      }
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      quantity
      cost {
        amountPerQuantity { amount }
        subtotalAmount { amount }
      }
      sellingPlanAllocation { __typename }
      merchandise {
        __typename
        ... on ProductVariant {
          sku
          title
          weight
          product {
            title
            productType
            vendor
            hasTags(tags: $productTags) {
              tag
              hasTag
            }
          }
        }
      }
    }
    deliveryGroups {
      groupType
      deliveryAddress {
        firstName
        address1
        countryCode
        provinceCode
        zip
      }
      deliveryOptions {
        handle
        title
        cost { amount }
      }
    }
  }
  deliveryCustomization {
    metafield(namespace: "$app:delivery-customization", key: "function-configuration") {
      jsonValue
    }
  }
}
